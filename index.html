<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Page Title]</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
        }
        header, footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        nav {
            background-color: #f8f9fa;
            padding: 0.5em 0;
            text-align: center;
        }
        section {
            padding: 2em;
            max-width: 800px;
            margin: 0 auto;
        }
        .download-button {
            display: inline-block;
            padding: 0.5em 1em;
            margin: 1em 0;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        .download-button:hover {
            background-color: #0056b3;
        }
        @media (max-width: 600px) {
            body {
                padding: 1em;
            }
            section {
                padding: 1em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>[Page Title]</h1>
    </header>
    <nav>
        <!-- Navigation links or menu can be placed here -->
    </nav>
    <section id="introduction">
        <h2>Introduction</h2>
        <p>[Short Intro/Bio]</p>
    </section>
    <section id="main-content">
        <h2>Main Content</h2>
        <p><!-- Main content goes here --></p>
        <h3>Downloads</h3>
        <a href="#" class="download-button">Download Example 1</a>
        <a href="#" class="download-button">Download Example 2</a>
        <a href="#" class="download-button">Download Example 3</a>
    </section>
    <footer>
        <p>© [Year] [Your Name]. All rights reserved.</p>
    </footer>
</body>
</html>
